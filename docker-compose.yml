networks:
  db-data-net:
    driver: bridge
services:
  todolist:
    image: app:1.2
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=Development
    networks:
      - db-data-net
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:latest
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql 
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
     - db-data-net
volumes:
  db-data:
  